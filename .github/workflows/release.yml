name: release

# Tag-driven distribution (M9): a v* tag builds the full gate on Windows —
# including the network tier, since tag builds are rare — and publishes a
# GitHub release with both installers, the portable exe and the validation
# checklist. Tags containing -rc publish as prereleases; the WINDOWS-
# VALIDATION.md §7 VM pass gates the final tag. Release assets are
# permanent, unlike run artifacts which age out (90-day retention).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml
    with:
      network_tests: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist
          find dist -type f | sort

      # upload-artifact preserves the matched paths' common ancestor, so the
      # installer artifact unpacks as <artifact>/nsis/*.exe and
      # <artifact>/msi/*.msi. Flatten every artifact tree into one directory so
      # gh uploads files, not the nsis/msi subdirectories it would otherwise
      # pick up from a one-level glob ("read .../msi: is a directory").
      - name: Stage release assets
        run: |
          mkdir -p assets
          find dist -type f -exec cp -v {} assets/ \;
          ls -l assets

      # This job deliberately skips checkout — it only needs the downloaded
      # artifacts. gh would otherwise look for a local git repo to resolve the
      # target and fail ("fatal: not a git repository"), so every gh call
      # names the repo explicitly; --verify-tag asserts the tag already exists
      # rather than letting gh create one locally.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FLAGS=""
          case "$TAG" in
            *-rc*) FLAGS="--prerelease" ;;
          esac
          # Idempotent for re-runs and re-pushed tags: drop a prior release for
          # this tag first, but never the tag itself (the push that triggered
          # this run owns it).
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes \
            --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            $FLAGS \
            --title "Typecase ${TAG#v}" \
            --generate-notes \
            assets/*
