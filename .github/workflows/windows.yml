name: windows-ci

# Windows validation, tier 1 (automated): the project must compile, test and
# package on real Windows on every push. Nightly on schedule, the run also
# executes the network integration tests (the real Google Fonts endpoint
# exercised from a Windows IP) — catching endpoint or pipeline drift that
# push builds skip. Tier 2 (manual, scripted in WINDOWS_VALIDATION.md)
# covers what a headless runner cannot: UxTheme title bars, font
# installation, reboot persistence.
#
# Since M9 the build body lives in build-windows.yml (shared with
# release.yml) so the gate and release builds cannot drift. This file only
# chooses when the gate runs and whether the network tier is included:
# scheduled runs always run the network tier; dispatch runs when asked;
# ordinary pushes skip it to stay fast and hermetic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      network_tests:
        description: "Also run the network integration tests (real Google Fonts endpoint)"
        type: boolean
        default: false
  schedule:
    # Nightly full gate + network tier. Deliberately off the top of the hour
    # (GitHub throttles exact-hour crons). Scheduled runs fire only once this
    # workflow exists on the default branch.
    - cron: "23 3 * * *"

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      network_tests: ${{ github.event_name == 'schedule' || inputs.network_tests == true }}
