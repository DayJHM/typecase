name: windows-build

# Reusable build body shared by windows.yml (push/PR/nightly gate) and
# release.yml (tag builds). Extracted in M9 so the gate and release builds
# cannot drift: the steps here are the single source of truth for what a
# Typecase Windows build runs (M9_DISTRIBUTION_DESIGN.md §3).
#
# Path note: every Typecase/ prefix below assumes the repository root is the
# workspace (the repo contains a Typecase folder). If the repo is rooted at
# the project itself, drop the prefixes here and in the cache/artifact paths.

on:
  workflow_call:
    inputs:
      network_tests:
        description: "Also run the network integration tests (real Google Fonts endpoint)"
        type: boolean
        default: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Typecase
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Typecase/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Typecase/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Frontend build (vite)
        run: npm run build

      - name: Rust tests (unit + non-network integration)
        run: cargo test --locked
        working-directory: Typecase/src-tauri

      # Network tier — the download pipeline against the real Google Fonts
      # endpoint from a Windows IP. Release builds always run it; ordinary
      # pushes get it only when the caller forwards network_tests (nightly
      # schedule or dispatch input), or RUN_NETWORK_TESTS is set on the repo.
      - name: Rust network integration tests
        if: >-
          inputs.network_tests == true ||
          vars.RUN_NETWORK_TESTS == 'true'
        run: cargo test --locked --test download_pipeline -- --ignored
        working-directory: Typecase/src-tauri
        env:
          # keep reqwest from picking up runner proxies unexpectedly
          NO_PROXY: fonts.googleapis.com,fonts.gstatic.com

      - name: Bundle installers (NSIS + MSI)
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: typecase-windows-installers
          path: |
            Typecase/src-tauri/target/release/bundle/nsis/*.exe
            Typecase/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # M9 portable artifact: the raw release exe, plus the documented package
      # (§35: a portable *client*, not a bare binary). Tauri 2 has no dedicated
      # portable bundle target on Windows; the same binary runs standalone
      # because WebView2 ships in Windows 10 1809+/11 (Evergreen runtime, and
      # webviewInstallMode in tauri.conf.json names the installer strategy
      # explicitly). It shares the installed build's per-user data root by
      # design (M9_DISTRIBUTION_DESIGN.md §2; checklist §7.6).
      - name: Stage portable exe
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $src = "$root/Typecase/src-tauri/target/release"
          $exe = Get-Item "$src/typecase.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            $exe = Get-ChildItem $src -Filter *.exe |
              Where-Object { $_.Name -notmatch '(?i)uninstall|setup|installer' } |
              Sort-Object Length -Descending | Select-Object -First 1
          }
          if (-not $exe) { throw "no release exe found under $src" }
          Copy-Item $exe.FullName "$root/Typecase-portable.exe"
          "Staged portable: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      # Portability guard (M9_DISTRIBUTION_DESIGN.md §2). The portable build is
      # one self-contained file — run from a USB stick or Downloads folder with
      # nothing beside it — because the WebView2 loader is linked statically, the
      # frontend and catalog are embedded, and installers cover the WebView2
      # runtime. A new dependency would put a sibling DLL back in the
      # requirements without breaking any other check, so the exe's import
      # tables are read and compared against the Windows DLLs. The walk lives in
      # the repo (Typecase/packaging/verify-portable-imports.ps1) so the allow
      # list is reviewable in a diff.
      - name: Verify portable exe is self-contained (imports Windows DLLs only)
        shell: pwsh
        run: |
          $guard = "$env:GITHUB_WORKSPACE/Typecase/packaging/verify-portable-imports.ps1"
          $exe = "$env:GITHUB_WORKSPACE/Typecase-portable.exe"

          # The real check, against the Windows DLL allow list.
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$guard" -Path "$exe"
          if ($LASTEXITCODE -ne 0) {
            throw "the portable exe imports something other than Windows DLLs (exit $LASTEXITCODE)"
          }

          # Negative test: the same guard must reject a DLL it does not allow.
          # Without this the check could break at the comparison and pass every
          # build — a guard that cannot fail is worse than no guard.
          $output = & pwsh -NoProfile -ExecutionPolicy Bypass -File "$guard" -Path "$exe" `
            -AllowList 'kernel32.dll' 2>&1
          $code = $LASTEXITCODE
          $output | Select-Object -First 2 | ForEach-Object { "  guard said: $_" }
          if ($code -eq 0) {
            throw "the guard passed an allow list that omits 24 of the imports — it cannot fail"
          }
          "Negative test passed: a restricted allow list is rejected (exit $code)"

          # The negative test deliberately left a non-zero last exit code, and
          # the pwsh shell wrapper exits the step with $LASTEXITCODE — left
          # alone, a passing step would report failure (run 36635488776). Both
          # assertions above throw rather than fall through, so this point means
          # the guard checked the exe and rejected a bad allow list.
          exit 0

      # Tier-1 half of WINDOWS_VALIDATION.md 7.1/7.8. The import guard above
      # proves the exe needs nothing beside it; it cannot prove the exe starts. A
      # panic, a missing WebView2 runtime or a window that never initialises all
      # give a process that dies or stalls, and a windows-subsystem binary prints
      # nothing here to say why. The script is in the repo so the assertion and
      # the diagnostics are reviewable, and it asserts the *configured* window
      # title: the startup-failure dialog is titled "Typecase ... startup failed"
      # and blocks until dismissed, so a looser "a window appeared" check would
      # pass on the very failure this step exists to catch.
      - name: Smoke-test portable exe (window comes up)
        shell: pwsh
        timeout-minutes: 4
        run: |
          $root = $env:GITHUB_WORKSPACE
          $smoke = "$root/Typecase/packaging/smoke-test-portable.ps1"
          $exe = "$root/Typecase-portable.exe"
          # The title is read from the file the app is built from, so the check
          # cannot drift from the app.
          $title = (Get-Content "$root/Typecase/src-tauri/tauri.conf.json" -Raw |
            ConvertFrom-Json).app.windows[0].title
          $shot = "$root/Typecase-portable-screenshot.png"

          # The screenshot is asserted on inside the script (a window that never
          # painted is a flat rectangle), so a run that produces no image or a
          # blank one fails here rather than quietly uploading nothing useful.
          pwsh -NoProfile -ExecutionPolicy Bypass -File $smoke -Exe $exe `
            -ExpectedWindowTitle $title -ScreenshotPath $shot
          if ($LASTEXITCODE -ne 0) {
            throw "the portable exe did not come up (exit $LASTEXITCODE)"
          }

          # Negative test, as for the import guard: this script must reject a
          # launch it did not observe, or it proves nothing about the runs it
          # claims to validate. A wrong expected title cannot match, so five
          # seconds are enough — the point is the verdict, not the wait.
          pwsh -NoProfile -ExecutionPolicy Bypass -File $smoke -Exe $exe `
            -ExpectedWindowTitle 'Not the Typecase main window' -TimeoutSeconds 5
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            throw "the smoke test passed with a wrong expected window title — it cannot fail"
          }
          "Negative test passed: a wrong window title is rejected (exit $code)"

          # The negative test left a non-zero $LASTEXITCODE and the pwsh shell
          # wrapper exits the step with it (run 36635488776), so reset it here:
          # reaching this line means the exe came up and the negative test was
          # rejected.
          exit 0

      # `always()` because the screenshot is the evidence for the step above: on a
      # failure it is exactly what someone needs to see, and GitHub skips ordinary
      # steps once one has failed. A missing file warns rather than fails, so this
      # step never becomes a second, confusing red herring.
      - name: Upload portable screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecase-portable-screenshot
          path: Typecase-portable-screenshot.png
          if-no-files-found: warn

      # The package is the verified exe plus a README stating the supported
      # systems, the WebView2 requirement, where data lives and how to verify the
      # download. The wording lives in the repo
      # (Typecase/packaging/portable-README.txt) so it is reviewable and
      # diffable instead of buried in this workflow.
      - name: Package portable build (exe + README)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $hash = (Get-FileHash "$root/Typecase-portable.exe" -Algorithm SHA256).Hash.ToLower()
          $version = (Get-Content "$root/Typecase/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $rev = "$env:GITHUB_REF_NAME @ $($env:GITHUB_SHA.Substring(0,7))"
          $readme = Get-Content "$root/Typecase/packaging/portable-README.txt" -Raw
          $readme = $readme.Replace('VERSION_HERE', $version)
          $readme = $readme.Replace('HASH_HERE', $hash)
          $readme = $readme.Replace('REV_HERE', $rev)
          $readme = $readme.Replace('WEBVIEW2_URL_HERE', 'https://developer.microsoft.com/microsoft-edge/webview2/')

          New-Item -ItemType Directory -Force -Path "$root/portable" | Out-Null
          Set-Content -Path "$root/portable/README.txt" -Value $readme -Encoding utf8NoBOM
          Copy-Item "$root/Typecase-portable.exe" "$root/portable/Typecase-portable.exe"
          Compress-Archive -Path "$root/portable/Typecase-portable.exe", "$root/portable/README.txt" `
            -DestinationPath "$root/Typecase-portable-x64.zip" -Force
          $zip = Get-Item "$root/Typecase-portable-x64.zip"
          "Staged package: $($zip.Name) ($([math]::Round($zip.Length/1MB,1)) MB), exe sha256 $($hash.Substring(0,12))..."

      - name: Upload portable build (exe + package)
        uses: actions/upload-artifact@v7
        with:
          name: typecase-windows-portable
          path: |
            Typecase-portable.exe
            Typecase-portable-x64.zip
          if-no-files-found: error

      # Tier-2 prep: stage the manual checklist next to the artifacts so the
      # VM session (WINDOWS_VALIDATION.md) starts from the exact build.
      - name: Upload validation checklist
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-checklist
          path: Typecase/WINDOWS_VALIDATION.md
